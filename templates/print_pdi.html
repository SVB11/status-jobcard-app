<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Print PDI</title>
    <style>
        body { font-family: Arial, sans-serif; font-size: 13px; color: #111; margin: 24px; }
        h1,h2 { margin: 0 0 8px; color: #025daa; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #025daa; padding-bottom: 10px; margin-bottom: 16px; }
        .logo { height: 48px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
        th, td { border: 1px solid #ccc; padding: 6px 8px; text-align: left; vertical-align: top; }
        th { background: #f3f4f6; }
        .muted { color: #555; }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body>
    <div class="no-print" style="margin-bottom:12px;">
        <button onclick="window.print()">Print PDI</button>
        <a href="/jobs/{{ job_id }}">Back to job</a>
    </div>
    <div class="header">
        <div>
            <img src="/static/images/status_logo.svg" class="logo" alt="Status Truck Sales">
            <div class="muted">Pre-Delivery Inspection (PDI)</div>
        </div>
        <div id="title"></div>
    </div>
    <div id="content">Loading...</div>
<script>
    const jobId = {{ job_id }};
    async function load() {
        const p = await (await fetch('/api/jobs/' + jobId + '/pdi')).json();
        const j = p.job;
        document.getElementById('title').innerHTML = '<strong>' + j.job_number + '</strong><div class="muted">' + j.stock_number + '</div>';
        let html = '<table>';
        [['Stock', j.stock_number], ['Vehicle', j.vehicle_description],
         ['Type', j.main_type + ' / ' + j.sub_type], ['Year', j.year || '—'],
         ['Client', j.client_name], ['Salesman', j.salesman_name],
         ['Workshop signed', j.pdi_signed_workshop ? 'Yes' : 'No'],
         ['Sales signed', j.pdi_signed_sales ? 'Yes' : 'No']].forEach(function(r) {
            html += '<tr><th>' + r[0] + '</th><td>' + r[1] + '</td></tr>';
        });
        html += '</table><h2>PDI Checklist</h2><table><tr><th>#</th><th>Item</th><th>Criteria</th><th>Result</th><th>Notes</th></tr>';
        (p.items || []).forEach(function(it) {
            html += '<tr><td>' + (it.item_number || '') + '</td><td>' + it.check_item + '</td><td class="muted">' + (it.acceptance_criteria || '') + '</td><td>' + (it.status || '') + '</td><td>' + (it.notes || '') + '</td></tr>';
        });
        html += '</table>';
        document.getElementById('content').innerHTML = html;
    }
    load();
</script>
</body>
</html>
