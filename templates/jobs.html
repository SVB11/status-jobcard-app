{% extends "base.html" %}

{% block title %}Job Cards{% endblock %}

{% block header_right %}
<div class="flex items-center gap-3">
    <span id="userInfo" class="text-sm text-gray-600"></span>
    <button onclick="logout()" class="text-sm text-red-600 hover:underline">Logout</button>
</div>
{% endblock %}

{% block content %}
<div class="mb-5">
    <h1 class="text-2xl font-bold uppercase tracking-wide">Job Cards</h1>
    <p class="text-sm text-[#9aa6b4]">Open jobs only. Delivered jobs move to Closed.</p>
</div>

<div class="sticky-sub" id="filterBar">
    <div class="flex flex-wrap gap-2 mb-3">
    <button type="button" data-f="all" class="g-filter on">All</button>
    <button type="button" data-f="needs" class="g-filter">My jobs</button>
    <button type="button" data-f="workshop" class="g-filter">In workshop</button>
    <button type="button" data-f="third" class="g-filter">At 3rd party</button>
    <button type="button" data-f="ready" class="g-filter">Ready</button>
    </div>
    <input id="wsSearch" type="search" placeholder="FIND WS / VEHICLE" class="w-full px-3 py-3 rounded-lg bg-[#11151c] border border-[#2a3340] text-white uppercase text-sm">
</div>

<div id="jobsContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
    <p class="text-[#9aa6b4] text-sm col-span-full">Loading jobs...</p>
</div>
{% endblock %}

{% block scripts %}
<style>
.g-filter { padding: 8px 14px; border-radius: 999px; border: 1px solid #2a3340; background: #11151c; color: #d5dde6; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
.g-filter.on { background: #025daa; border-color: #025daa; color: #fff; }
.g-card { display: block; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16); border-radius: 14px; padding: 12px 16px 16px; color: #e8edf3; text-decoration: none; backdrop-filter: blur(22px) saturate(140%); -webkit-backdrop-filter: blur(22px) saturate(140%); box-shadow: 0 8px 24px rgba(0,0,0,0.2);  text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0 0 3px #000; }
.g-card:hover { border-color: #025daa; }
</style>
<script>
    const token = localStorage.getItem('token');
    const fullName = localStorage.getItem('full_name') || '';
    const role = (localStorage.getItem('role') || '').toLowerCase();
    const userId = localStorage.getItem('user_id');
    if (!token) window.location.href = '/login';
    if (role === 'stock') window.location.href = '/stock';
    document.getElementById('userInfo').textContent = fullName + ' (' + role + ')';
    function logout() { localStorage.clear(); window.location.href = '/login'; }

    const WORKSHOP = ['yard','bay 1 reuben','bay 2 ricardo','bay 3 jonas','bay 4 josiah','bay 5 josiah 2','wash bay','test pit bay 1','test pit bay 2','test pit bay 3'];
    const THIRD = ['3rd party','pft','fk','stt','itl','east rand','liquid flow','man auto','scotty','calibration'];
    let allJobs = [];
    let currentFilter = 'all';

    function locOf(j) { return (j.current_location || '').toLowerCase(); }
    function isWorkshop(j) { return WORKSHOP.indexOf(locOf(j)) !== -1; }
    function isThird(j) {
        const l = locOf(j);
        if (l === '3rd party') return true;
        return THIRD.some(function(k){ return l.indexOf(k) !== -1; });
    }
    function isReady(j) {
        const s = (j.status || '').toLowerCase();
        return s.indexOf('ready') !== -1 || s.indexOf('delivered') !== -1 || s === 'pdi completed' || s === 'work completed';
    }
    function isMine(j) {
        const uid = parseInt(userId || '0');
        if ((j.salesman_name || '') === fullName) return true;
        if (j.created_by && uid && parseInt(j.created_by) === uid) return true;
        if (j.accepted_by && uid && parseInt(j.accepted_by) === uid) return true;
        return false;
    }
    function needsMe(j) {
        return isMine(j);
    }
    function statusClass(s) {
        s = (s || '').toLowerCase();
        if (s.indexOf('fail') !== -1) return 'bg-red-700';
        if (s.indexOf('ready') !== -1 || s.indexOf('delivered') !== -1) return 'bg-green-700';
        if (s.indexOf('progress') !== -1) return 'bg-[#025daa]';
        if (s.indexOf('submitted') !== -1) return 'bg-amber-700';
        return 'bg-[#2a3340]';
    }

    function render() {
        const q = (document.getElementById('wsSearch').value || '').toLowerCase().trim();
        let rows = allJobs.slice();
        if (currentFilter === 'needs') rows = rows.filter(needsMe);
        if (currentFilter === 'workshop') rows = rows.filter(isWorkshop);
        if (currentFilter === 'third') rows = rows.filter(isThird);
        if (currentFilter === 'ready') rows = rows.filter(isReady);
        if (q) {
            rows = rows.filter(function(j) {
                return (j.stock_number || '').toLowerCase().indexOf(q) !== -1
                    || (j.vehicle_description || '').toLowerCase().indexOf(q) !== -1
                    || (j.job_number || '').toLowerCase().indexOf(q) !== -1;
            });
        }
        const box = document.getElementById('jobsContainer');
        if (!rows.length) {
            box.innerHTML = '<div class="col-span-full text-[#9aa6b4] text-sm p-6">No jobs in this filter</div>';
            return;
        }
        box.innerHTML = rows.map(function(j) {
            const accept = (role === 'workshop' || role === 'admin' || role === 'accounts') && j.status === 'Submitted to Workshop';
            return '<a class="g-card" href="/jobs/' + j.id + '">' +
                (j.photo_url ? '<img class="stock-thumb mb-3" src="' + j.photo_url + '" alt="">' : '') +
                '<div class="text-lg font-bold tracking-wide">' + (j.stock_number || j.job_number) + '</div>' +
                '<div class="text-sm mt-1">' + (j.vehicle_description || '') + '</div>' +
                '<div class="text-xs text-[#9aa6b4] mt-1 uppercase">' + (j.year || '') + (j.main_type ? ' · ' + j.main_type : '') + '</div>' +
                '<div class="flex flex-wrap gap-2 mt-3">' +
                '<span class="text-xs px-2 py-1 rounded bg-[#1b2430]">' + (j.current_location || 'No location') + '</span>' +
                '<span class="text-xs px-2 py-1 rounded ' + statusClass(j.status) + '">' + (j.status || '') + '</span>' +
                '</div>' +
                (accept ? '<div class="mt-3 text-xs uppercase tracking-wider text-[#7ec2ff]">Tap card then Accept on the job</div>' : '') +
                '</a>';
        }).join('');
    }

    document.querySelectorAll('.g-filter').forEach(function(btn) {
        btn.onclick = function() {
            document.querySelectorAll('.g-filter').forEach(function(b){ b.classList.remove('on'); });
            btn.classList.add('on');
            currentFilter = btn.getAttribute('data-f');
            render();
        };
    });
    document.getElementById('wsSearch').addEventListener('input', render);

    async function loadJobs() {
        try {
            const res = await fetch('/api/jobs', { headers: { 'Authorization': 'Bearer ' + token } });
            const data = await res.json();
            allJobs = data.jobs || [];
            render();
        } catch (err) {
            document.getElementById('jobsContainer').innerHTML = '<p class="text-red-500 text-sm">Could not load jobs.</p>';
        }
    }
    loadJobs();
</script>
{% endblock %}
