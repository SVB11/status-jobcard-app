{% extends "base.html" %}

{% block title %}User Management{% endblock %}

{% block header_right %}
<div class="flex items-center gap-3">
    <span id="userInfo" class="text-sm text-gray-600"></span>
    <a href="/dashboard" class="text-sm text-status-blue hover:underline">Dashboard</a>
    <button onclick="logout()" class="text-sm text-red-600 hover:underline">Logout</button>
</div>
{% endblock %}

{% block content %}
<div class="mb-6">
    <h1 class="text-2xl font-bold text-gray-800">User Management</h1>
    <p class="text-gray-500 text-sm">Admin only — add staff and assign roles</p>
</div>

<div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <!-- Add User Form -->
    <div class="bg-white rounded-xl shadow p-5">
        <h2 class="font-semibold text-status-blue mb-4">Add New User</h2>
        <form id="addUserForm" class="space-y-3">
            <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">Full Name *</label>
                <input type="text" id="full_name" required class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-status-blue">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">Username *</label>
                <input type="text" id="username" required class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-status-blue">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">Password *</label>
                <input type="text" id="password" required class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-status-blue">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">Role *</label>
                <select id="role" class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-status-blue">
                    <option value="sales">Sales</option>
                    <option value="workshop">Workshop</option>
                    <option value="accounts">Accounts</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <button type="submit" class="w-full bg-status-blue text-white py-2 rounded-lg text-sm font-medium hover:bg-blue-800">Add User</button>
            <div id="addMsg" class="text-sm hidden"></div>
        </form>
    </div>

    <!-- Users List -->
    <div class="lg:col-span-2 bg-white rounded-xl shadow p-5">
        <h2 class="font-semibold text-status-blue mb-4">All Users</h2>
        <div id="usersList" class="space-y-2">
            <p class="text-sm text-gray-400">Loading...</p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const token = localStorage.getItem('token');
    const fullName = localStorage.getItem('full_name') || '';
    const role = localStorage.getItem('role') || '';

    if (!token) window.location.href = '/login';
    if (role !== 'admin' && role !== 'accounts') {
        alert('Admin access only');
        window.location.href = '/dashboard';
    }
    document.getElementById('userInfo').textContent = fullName + ' (admin)';

    function logout() {
        localStorage.clear();
        window.location.href = '/login';
    }

    function roleBadge(r) {
        const colours = {
            admin: 'bg-purple-100 text-purple-700',
            sales: 'bg-blue-100 text-blue-700',
            workshop: 'bg-green-100 text-green-700',
            accounts: 'bg-yellow-100 text-yellow-700'
        };
        return '<span class="px-2 py-0.5 text-xs rounded-full ' + (colours[r] || 'bg-gray-100') + '">' + r + '</span>';
    }

    async function loadUsers() {
        try {
            const res = await fetch('/api/admin/users', {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const data = await res.json();
            const users = data.users || [];
            let html = '';
            users.forEach(function(u) {
                html += '<div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">' +
                    '<div>' +
                    '<div class="font-medium text-sm">' + u.full_name + ' ' + roleBadge(u.role) + 
                    (!u.is_active ? ' <span class="text-xs text-red-500">(inactive)</span>' : '') + '</div>' +
                    '<div class="text-xs text-gray-500">@' + u.username + '</div>' +
                    '</div>' +
                    '<div class="flex gap-2">' +
                    '<button onclick="toggleUser(' + u.id + ')" class="text-xs px-2 py-1 border rounded hover:bg-white">' + 
                    (u.is_active ? 'Deactivate' : 'Activate') + '</button>' +
                    '<button onclick="resetPassword(' + u.id + ', \'' + u.username + '\')" class="text-xs px-2 py-1 border rounded hover:bg-white">Reset PW</button>' +
                    '</div></div>';
            });
            document.getElementById('usersList').innerHTML = html || '<p class="text-sm text-gray-400">No users</p>';
        } catch (err) {
            document.getElementById('usersList').innerHTML = '<p class="text-red-500 text-sm">Could not load users</p>';
        }
    }

    document.getElementById('addUserForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const msg = document.getElementById('addMsg');
        msg.classList.add('hidden');
        try {
            const res = await fetch('/api/admin/users', {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + token,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    full_name: document.getElementById('full_name').value,
                    username: document.getElementById('username').value,
                    password: document.getElementById('password').value,
                    role: document.getElementById('role').value
                })
            });
            const data = await res.json();
            if (!res.ok) {
                msg.textContent = data.detail || 'Failed';
                msg.className = 'text-sm text-red-600';
                msg.classList.remove('hidden');
                return;
            }
            msg.textContent = 'User added successfully';
            msg.className = 'text-sm text-green-600';
            msg.classList.remove('hidden');
            document.getElementById('addUserForm').reset();
            loadUsers();
        } catch (err) {
            msg.textContent = 'Connection error';
            msg.className = 'text-sm text-red-600';
            msg.classList.remove('hidden');
        }
    });

    async function toggleUser(id) {
        try {
            await fetch('/api/admin/users/' + id + '/toggle', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + token }
            });
            loadUsers();
        } catch (err) {
            alert('Failed');
        }
    }

    async function resetPassword(id, username) {
        const pw = prompt('New password for ' + username + ':');
        if (!pw) return;
        try {
            const res = await fetch('/api/admin/users/' + id + '/reset-password', {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + token,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ password: pw })
            });
            const data = await res.json();
            if (!res.ok) {
                alert(data.detail || 'Failed');
                return;
            }
            alert('Password updated');
        } catch (err) {
            alert('Connection error');
        }
    }

    loadUsers();
</script>
{% endblock %}
