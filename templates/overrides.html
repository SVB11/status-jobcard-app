{% extends "base.html" %}
{% block title %}Overrides{% endblock %}
{% block content %}
<div class="mb-6">
    <div class="nl-overline">Admin</div>
    <h1 class="nl-h1 text-2xl font-bold uppercase">Overrides</h1>
    <p class="text-sm text-[#9aa6b4]">Admin overrides, bulk completions and reopens. Who, when and why.</p>
</div>
<div id="list" class="space-y-2 text-sm">Loading...</div>
{% endblock %}
{% block scripts %}
<script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/login';
    async function load() {
        const res = await fetch('/api/admin/overrides', { headers: { 'Authorization': 'Bearer ' + token } });
        const data = await res.json().catch(function(){ return {}; });
        const box = document.getElementById('list');
        if (!res.ok) { box.textContent = data.detail || 'Admin only'; return; }
        const rows = data.events || [];
        if (!rows.length) { box.textContent = 'None yet.'; return; }
        box.innerHTML = rows.map(function(e) {
            return '<a href="/jobs/' + e.job_id + '" class="block p-3 rounded-xl border border-[#2a3340] bg-[#12161ce8]">' +
                '<div class="font-semibold uppercase">' + (e.event_type || '') + ' · ' + jobDisplayLabel(e) + '</div>' +
                '<div class="text-xs text-[#9aa6b4]">' + (e.who || '') + (e.on_behalf_of ? ' on behalf of ' + e.on_behalf_of : '') +
                ' · ' + (e.when || '').replace('T',' ').substring(0,16) + '</div>' +
                '<div class="mt-1">' + (e.side || '') + (e.reason ? ' — ' + e.reason : '') + '</div></a>';
        }).join('');
    }
    load();
</script>
{% endblock %}
