<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Status Truck Sales{% endblock %} – Job Card System</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/static/images/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="Job Cards">
    <meta name="theme-color" content="#025daa">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --status-blue: #1a8cff;
            --status-blue-dark: #025daa;
            --bg: #07090c;
            --panel: #12161c;
            --panel-2: #1a2028;
            --line: #2a3340;
            --text: #e8edf3;
            --muted: #9aa6b4;
        }
        html, body {
            background-color: var(--bg);
            background-image: linear-gradient(180deg, rgba(7,9,12,.55), rgba(7,9,12,.88)), url('/static/images/yard_dusk.jpg');
            background-size: cover;
            background-position: center top;
            background-attachment: fixed;
            color: var(--text);
            font-family: 'Barlow', Arial, sans-serif;
        }
        .bg-status-blue { background-color: #025daa; }
        .text-status-blue { color: #5eb0ff; }
        .border-status-blue { border-color: #025daa; }
        .hover\:bg-status-blue:hover { background-color: #024a8a; }
        input, select, textarea, button { font-size: 16px; }
        input, select, textarea { min-height: 44px; }
        button, a.btn, .tap { min-height: 44px; }
        h1, h2, h3, header a, .brand-title {
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .bg-white {
            background: rgba(18,22,28,0.82) !important;
            color: var(--text);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        .stock-hero { width: 100%; max-height: 240px; object-fit: contain; background: #12161c; border-radius: 12px; }
        .stock-thumb { width: 100%; height: 168px; object-fit: contain; background: #12161c; border-radius: 10px; }
        header.sticky-top { position: sticky; top: 0; z-index: 50; }
        .sticky-sub { position: sticky; top: 64px; z-index: 40; padding: 8px 0 10px; background: linear-gradient(180deg, rgba(7,9,12,.94), rgba(7,9,12,.78)); backdrop-filter: blur(12px); }
        details.dash-fold { background: rgba(18,22,28,0.82); border: 1px solid #2a3340; border-radius: 14px; padding: 12px 16px; margin-bottom: 16px; backdrop-filter: blur(16px); }
        details.dash-fold > summary { cursor: pointer; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; list-style: none; }
        details.dash-fold > summary::-webkit-details-marker { display: none; }
        details.dash-fold[open] > summary { margin-bottom: 10px; }
        .bg-gray-50, .bg-gray-100 { background-color: var(--panel-2) !important; }
        .text-gray-800, .text-gray-700, .text-gray-600 { color: var(--text) !important; }
        .text-gray-500, .text-gray-400 { color: var(--muted) !important; }
        .border, .border-b, .border-t { border-color: var(--line) !important; }
        input, select, textarea {
            background: #0d1116 !important;
            color: var(--text) !important;
            border-color: var(--line) !important;
        }
        .shadow, .shadow-md, .shadow-lg { box-shadow: 0 10px 30px rgba(0,0,0,0.35) !important; }
        a { color: #7ec2ff; }
        .bg-blue-50, .bg-amber-50, .bg-red-50, .bg-green-50 { background-color: #161b22 !important; }
        #tasksList, #partsSection, #thirdPartySection, #workshopExtras { scroll-margin-top: 80px; }
        #tasksList button, #actionButtons button {
            background: #025daa !important;
            color: #ffffff !important;
            font-weight: 800 !important;
            min-height: 44px;
            padding: 10px 14px !important;
            border-radius: 8px;
        }
        #tasksList button.task-off {
            background: #2a3340 !important;
            color: #ffffff !important;
        }
        #tasksList button.task-on {
            background: #025daa !important;
            color: #ffffff !important;
            box-shadow: 0 0 0 2px #ffffff;
        }
        #tasksList button.task-done { background: #15803d !important; color: #fff !important; }
        #tasksList button.task-block { background: #b91c1c !important; color: #fff !important; }
        #tasksList select, #tasksList input {
            color: #ffffff !important;
            background: #0d1116 !important;
            min-height: 44px;
        }
        .task-label { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #7ec2ff; margin-bottom: 4px; }
        @media (max-width: 640px) {
            header .nav-text { display: none; }
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="min-h-screen">
    <header class="sticky-top bg-[#0c1015]/92 border-b-2 border-[#025daa] backdrop-blur">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <img src="/static/images/status_logo_white.png" alt="Status Truck Sales" class="h-12 w-auto">
                <div class="hidden sm:block">
                    <div class="text-xs text-[#9aa6b4] uppercase tracking-widest">Job Card System</div>
                </div>
            </div>
            <div class="flex items-center gap-3 flex-wrap justify-end uppercase text-xs tracking-wider">
                <a href="/dashboard" class="text-[#7ec2ff] font-semibold">Dashboard</a>
                <a href="/jobs" id="navJobs" class="text-[#7ec2ff] font-semibold">Jobs</a>
                <a href="/jobs/archive" id="navArchive" class="hidden text-[#7ec2ff] font-semibold">Closed</a>
                <a href="/admin/users" id="navUsers" class="hidden text-[#7ec2ff] font-semibold">Users</a>
                <a href="/admin/third-parties" id="navTp" class="hidden text-[#7ec2ff] font-semibold">3rd Parties</a>
                <a href="/stock" id="navStock" class="hidden text-[#7ec2ff] font-semibold">Workshop stock</a>
                <a href="/supplier" id="navSupplier" class="hidden text-[#7ec2ff] font-semibold">Supplier jobs</a>
                <a href="/jobs/create" id="navCreate" class="text-white bg-status-blue px-3 py-2 rounded-lg font-semibold">Create</a>
                <button type="button" id="bellBtn" onclick="toggleBell()" class="relative text-[#7ec2ff] font-semibold">
                    Alerts
                    <span id="bellBadge" class="hidden absolute -top-2 -right-3 min-w-[18px] h-[18px] px-1 rounded-full bg-red-600 text-white text-[10px] leading-[18px] text-center">0</span>
                </button>
                <button type="button" onclick="enablePings()" class="text-[#7ec2ff] font-semibold">Enable phone pings</button>
                {% block header_right %}{% endblock %}
            </div>
        </div>
    </header>

    <div id="bellPanel" class="hidden fixed right-3 top-20 z-50 w-[92vw] max-w-sm max-h-[70vh] overflow-auto rounded-xl border border-[#2a3340] bg-[#12161ce8] backdrop-blur p-3">
        <div class="flex items-center justify-between mb-2">
            <div class="uppercase text-xs tracking-widest text-[#9aa6b4]">Updates</div>
            <button type="button" onclick="markBellRead()" class="text-xs text-[#7ec2ff]">Mark read</button>
        </div>
        <div id="bellList" class="space-y-2 text-sm text-[#e8edf3]">No alerts</div>
    </div>
    <main class="max-w-7xl mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center py-8">
        <img src="/static/images/slogan_quality.png" alt="Quality, Reliability." class="h-16 sm:h-20 mx-auto mb-4">
        <div class="text-xs text-[#6b7683] uppercase tracking-widest">Status Truck Sales &bull; Boksburg &bull; Internal Use Only</div>
    </footer>

    <script>
    function urlBase64ToUint8Array(base64String) {
        const padding = '='.repeat((4 - base64String.length % 4) % 4);
        const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
        const rawData = atob(base64);
        const outputArray = new Uint8Array(rawData.length);
        for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
        return outputArray;
    }
    async function enablePings() {
        if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
            alert('This phone browser cannot receive web pings. On iPhone: Add to Home Screen first, then open the app from the icon and tap Enable phone pings.');
            return;
        }
        const token = localStorage.getItem('token');
        const userId = localStorage.getItem('user_id');
        if (!token || !userId) { alert('Log in first, then tap Enable phone pings.'); return; }
        const perm = await Notification.requestPermission();
        if (perm !== 'granted') { alert('Notifications were blocked. Allow notifications for this site in phone settings.'); return; }
        const reg = await navigator.serviceWorker.register('/sw.js', { scope: '/' });
        await navigator.serviceWorker.ready;
        const keyRes = await fetch('/api/push/public-key');
        const keyData = await keyRes.json();
        const sub = await reg.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(keyData.key)
        });
        const save = await fetch('/api/push/subscribe', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
            body: JSON.stringify({ user_id: parseInt(userId), subscription: sub })
        });
        if (!save.ok) { alert('Could not save ping on the server'); return; }
        alert('Phone pings are on for this device.');
    }
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function(){});
    }
    (function(){
        var r = (localStorage.getItem('role') || '').toLowerCase();
        var el = document.getElementById('navStock');
        if (el && ['stock','workshop','admin','accounts'].indexOf(r) !== -1) el.classList.remove('hidden');
        var s = document.getElementById('navSupplier');
        if (s && r === 'supplier') s.classList.remove('hidden');
        var u = document.getElementById('navUsers');
        var t = document.getElementById('navTp');
        if (u && (r === 'admin' || r === 'accounts')) u.classList.remove('hidden');
        if (t && (r === 'admin' || r === 'accounts')) t.classList.remove('hidden');
        var ar = document.getElementById('navArchive');
        if (ar && (r === 'admin' || r === 'accounts')) ar.classList.remove('hidden');
        if (r === 'stock') {
            var nj = document.getElementById('navJobs');
            var nc = document.getElementById('navCreate');
            if (nj) nj.classList.add('hidden');
            if (nc) nc.classList.add('hidden');
        }
    })();
    async function refreshBell() {
        const uid = localStorage.getItem('user_id');
        const token = localStorage.getItem('token');
        if (!uid || !token) return;
        try {
            const res = await fetch('/api/notifications?user_id=' + uid, { headers: { 'Authorization': 'Bearer ' + token } });
            const data = await res.json();
            const unread = data.unread || 0;
            const badge = document.getElementById('bellBadge');
            if (badge) {
                if (unread > 0) { badge.textContent = unread > 9 ? '9+' : String(unread); badge.classList.remove('hidden'); }
                else { badge.classList.add('hidden'); }
            }
            if (navigator.setAppBadge) {
                if (unread) navigator.setAppBadge(unread);
                else if (navigator.clearAppBadge) navigator.clearAppBadge();
            }
            const list = document.getElementById('bellList');
            const rows = data.notifications || [];
            if (list) {
                if (!rows.length) list.innerHTML = '<div class="text-[#9aa6b4]">No alerts</div>';
                else list.innerHTML = rows.map(function(n) {
                    const href = n.job_card_id ? '/jobs/' + n.job_card_id : '/dashboard';
                    return '<a href="' + href + '" class="block p-2 rounded ' + (n.is_read ? 'bg-[#1a2028]' : 'bg-[#025daa33] border border-[#025daa]') + '">' +
                        (n.is_read ? '' : '<span class="inline-block w-2 h-2 rounded-full bg-red-500 mr-2"></span>') +
                        n.message + '<div class="text-[11px] text-[#9aa6b4] mt-1">' + (n.created_at || '').replace('T',' ').substring(0,16) + '</div></a>';
                }).join('');
            }
        } catch (e) {}
    }
    function toggleBell() {
        const p = document.getElementById('bellPanel');
        if (!p) return;
        p.classList.toggle('hidden');
        if (!p.classList.contains('hidden')) refreshBell();
    }
    async function markBellRead() {
        const uid = localStorage.getItem('user_id');
        const token = localStorage.getItem('token');
        if (!uid || !token) return;
        await fetch('/api/notifications/mark-read', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
            body: JSON.stringify({ user_id: parseInt(uid) })
        });
        refreshBell();
    }
    refreshBell();
    setInterval(refreshBell, 20000);
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
