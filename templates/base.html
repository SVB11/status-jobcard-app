<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Status Truck Sales{% endblock %} – Job Card System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --status-blue: #025daa;
            --status-dark: #040b0a;
        }
        .bg-status-blue { background-color: #025daa; }
        .text-status-blue { color: #025daa; }
        .border-status-blue { border-color: #025daa; }
        .hover\:bg-status-blue:hover { background-color: #024a8a; }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Header -->
    <header class="bg-white shadow-md border-b-4 border-status-blue">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <img src="/static/images/status_logo.svg" alt="Status Truck Sales" class="h-12 w-auto">
                <div class="hidden sm:block">
                    <div class="font-bold text-lg text-status-blue leading-tight">Status Truck Sales</div>
                    <div class="text-xs text-gray-500">Job Card & Workshop System</div>
                </div>
            </div>
            <div class="flex items-center gap-4">
                {% block header_right %}{% endblock %}
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="text-center text-xs text-gray-400 py-6">
        Status Truck Sales &bull; Boksburg, Gauteng &bull; Internal Use Only
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
