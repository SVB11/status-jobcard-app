{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[70vh]">
    <div class="bg-white rounded-xl shadow-lg p-8 w-full max-w-md">
        <div class="text-center mb-8">
            <img src="/static/images/status_logo.svg" alt="Status Truck Sales" class="h-16 mx-auto mb-4">
            <h1 class="text-2xl font-bold text-status-blue">Job Card System</h1>
            <p class="text-gray-500 text-sm mt-1">Sales & Workshop Portal</p>
        </div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <input type="text" id="username" name="username" required
                       class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-status-blue focus:border-status-blue outline-none"
                       placeholder="Enter your username">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="password" name="password" required
                       class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-status-blue focus:border-status-blue outline-none"
                       placeholder="Enter your password">
            </div>
            <div id="errorMsg" class="hidden text-red-600 text-sm text-center"></div>
            <button type="submit"
                    class="w-full bg-status-blue hover:bg-status-blue text-white font-semibold py-3 rounded-lg transition">
                Sign In
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-gray-400">
            Individual login credentials required for all staff
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const errorMsg = document.getElementById('errorMsg');

    const formData = new URLSearchParams();
    formData.append('username', username);
    formData.append('password', password);

    try {
        const res = await fetch('/token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: formData
        });

        if (!res.ok) {
            errorMsg.textContent = 'Incorrect username or password';
            errorMsg.classList.remove('hidden');
            return;
        }

        const data = await res.json();
        localStorage.setItem('token', data.access_token);
        localStorage.setItem('role', data.role);
        localStorage.setItem('full_name', data.full_name);
        if (data.user_id) localStorage.setItem('user_id', data.user_id);
        localStorage.setItem('must_change_password', data.must_change_password ? '1' : '0');
        window.location.href = '/dashboard';
    } catch (err) {
        errorMsg.textContent = 'Connection error. Please try again.';
        errorMsg.classList.remove('hidden');
    }
});
</script>
{% endblock %}
