{% extends "base.html" %}
{% block title %}Set new password{% endblock %}
{% block content %}
<div class="flex items-center justify-center min-h-[70vh]">
    <div class="login-card rounded-xl p-8 w-full max-w-md border border-[#2a3340] bg-[#12161c]/85 backdrop-blur">
        <div class="nl-overline">Account</div>
        <h1 class="text-2xl font-extrabold uppercase tracking-widest mb-2">Set new password</h1>
        <p class="text-sm text-[#9aa6b4] mb-6">You must choose a new password before you can use the app. At least 10 characters. It cannot be the same as the old one.</p>
        <form id="pwForm" class="space-y-4">
            <input type="password" id="current" required placeholder="Current password" class="w-full px-4 py-2.5 border rounded-lg">
            <input type="password" id="newPw" required minlength="10" placeholder="New password (min 10)" class="w-full px-4 py-2.5 border rounded-lg">
            <input type="password" id="again" required minlength="10" placeholder="Repeat new password" class="w-full px-4 py-2.5 border rounded-lg">
            <div id="msg" class="hidden text-sm"></div>
            <button type="submit" class="w-full bg-status-blue text-white font-extrabold uppercase tracking-widest py-3 rounded-lg">Save new password</button>
        </form>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/login';
    document.getElementById('pwForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const msg = document.getElementById('msg');
        const current = document.getElementById('current').value;
        const next = document.getElementById('newPw').value;
        const again = document.getElementById('again').value;
        msg.classList.remove('hidden');
        if (next.length < 10) { msg.className = 'text-sm text-red-500'; msg.textContent = 'New password must be at least 10 characters.'; return; }
        if (next !== again) { msg.className = 'text-sm text-red-500'; msg.textContent = 'The two new passwords do not match.'; return; }
        if (next === current) { msg.className = 'text-sm text-red-500'; msg.textContent = 'New password cannot be the same as the old one.'; return; }
        const res = await fetch('/api/me/set-password', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
            body: JSON.stringify({ current_password: current, new_password: next })
        });
        const data = await res.json().catch(function(){ return {}; });
        if (!res.ok) { msg.className = 'text-sm text-red-500'; msg.textContent = data.detail || 'Could not save password'; return; }
        localStorage.setItem('must_change_password', '0');
        msg.className = 'text-sm text-green-400';
        msg.textContent = 'Password saved. Opening the app.';
        window.location.href = '/dashboard';
    });
</script>
{% endblock %}
